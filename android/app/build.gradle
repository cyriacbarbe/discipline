plugins {
    id 'com.android.application'
}

// La clé de signature vit hors de Git (android/signature.properties) : toutes
// les versions doivent être signées par la même clé, sinon Android refuse la
// mise à jour et il faut désinstaller l'application.
def fichierSignature = rootProject.file('signature.properties')
def signature = new Properties()
if (fichierSignature.exists()) {
    fichierSignature.withInputStream { signature.load(it) }
}

android {
    namespace 'fr.discipline.app'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.discipline.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        discipline {
            if (fichierSignature.exists()) {
                storeFile rootProject.file(signature['storeFile'])
                storePassword signature['storePassword']
                keyAlias signature['keyAlias']
                keyPassword signature['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (fichierSignature.exists()) {
                signingConfig signingConfigs.discipline
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
